services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: complaints_qms
      POSTGRES_USER: qms_user
      POSTGRES_PASSWORD: qms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms_user -d complaints_qms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

